name: Deploy Artifact Mimicry MCP

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and test the production renderer container
        run: |
          docker build \
            --platform linux/amd64 \
            --tag artifact-mimicry-renderer:test \
            ../container
          docker run --rm \
            --platform linux/amd64 \
            artifact-mimicry-renderer:test \
            pytest -q
      - name: Resolve isolated OAuth KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          namespace="artifact-mimicry-oauth"
          listing="$(npx wrangler kv namespace list)"
          kv_id="$(node -e '
            const listing = JSON.parse(process.argv[1]);
            const match = listing.find(item =>
              item.title === "artifact-mimicry-oauth"
              || item.title.endsWith("-artifact-mimicry-oauth")
            );
            process.stdout.write(match?.id || "");
          ' "$listing")"
          if [ -z "$kv_id" ]; then
            created="$(npx wrangler kv namespace create "$namespace")"
            kv_id="$(node -e '
              const match = process.argv[1].match(/[0-9a-f]{32}/i);
              if (!match) process.exit(2);
              process.stdout.write(match[0]);
            ' "$created")"
          fi
          OAUTH_KV_ID="$kv_id" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            config.kv_namespaces = [{
              binding: "OAUTH_KV",
              id: process.env.OAUTH_KV_ID
            }];
            fs.writeFileSync(
              "deploy.wrangler.jsonc",
              JSON.stringify(config, null, 2),
              { mode: 0o600 }
            );
          '
      - name: Verify Cloudflare Containers permission before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler containers list --config deploy.wrangler.jsonc --json
      - name: Configure owner-only GitHub OAuth secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.MIMICRY_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.MIMICRY_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_CLIENT_ID"
          test -n "$GITHUB_CLIENT_SECRET"
          printf '%s' "$GITHUB_CLIENT_ID" |
            npx wrangler secret put GITHUB_CLIENT_ID --config deploy.wrangler.jsonc
          printf '%s' "$GITHUB_CLIENT_SECRET" |
            npx wrangler secret put GITHUB_CLIENT_SECRET --config deploy.wrangler.jsonc
      - run: npx wrangler deploy --config deploy.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
