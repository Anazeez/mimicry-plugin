name: Deploy Reach Gateway

"on":
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact Reach Gateway commit to deploy
        required: true
        type: string
      expected_tree_digest:
        description: SHA-256 of the exact Reach Gateway git tree listing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reach-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REACH_ORIGIN: https://reach-gateway.izeesub.workers.dev
      NO_COLOR: "1"
    steps:
      - name: Check out exact public Reach source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Anazeez/reach-gateway
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Verify exact source identity
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_TREE_DIGEST: ${{ inputs.expected_tree_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          observed="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          test "$observed" = "$EXPECTED_TREE_DIGEST"
          npm ci
          npm run check
          node --test test/provision-access.test.mjs
          node scripts/verify-no-secrets.mjs

      - name: Resolve the token's single Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node --input-type=module -e '
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts?per_page=2", {
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
            });
            const body = await response.json();
            if (!response.ok || body.success !== true || body.result?.length !== 1) process.exit(1);
            process.stdout.write(body.result[0].id);
          ')"
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Provision owner-private Managed OAuth
        run: node scripts/provision-access.mjs provision "$RUNNER_TEMP/reach-access"

      - name: Store owner identity and deploy bound configuration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret put REACH_OWNER_SUB < "$RUNNER_TEMP/reach-access/owner-email"
          issuer="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).issuer' "$RUNNER_TEMP/reach-access/deployment.json")"
          audience="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).audience' "$RUNNER_TEMP/reach-access/deployment.json")"
          npx wrangler deploy \
            --var "REACH_PUBLIC_ORIGIN:${REACH_ORIGIN}" \
            --var "REACH_OAUTH_ISSUER:${issuer}" \
            --var "REACH_OAUTH_AUDIENCE:${audience}"

      - name: Verify live health and OAuth boundary
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "${REACH_ORIGIN}/healthz")"
          HEALTH="$health" node --input-type=module -e '
            const value = JSON.parse(process.env.HEALTH);
            if (value.status !== "passed" || value.service !== "reach-gateway") process.exit(1);
          '
          oauth="$(curl --fail --silent --show-error "${REACH_ORIGIN}/.well-known/oauth-authorization-server")"
          OAUTH="$oauth" node --input-type=module -e '
            const value = JSON.parse(process.env.OAUTH);
            if (!value.issuer?.endsWith(".cloudflareaccess.com")) process.exit(1);
            if (!value.code_challenge_methods_supported?.includes("S256")) process.exit(1);
            if (!value.registration_endpoint) process.exit(1);
          '
          status="$(curl --silent --output "$RUNNER_TEMP/mcp-body" --write-out '%{http_code}' \
            -X POST "${REACH_ORIGIN}/mcp" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"reach-live-smoke","version":"1.0"}}}')"
          test "$status" = "401"

      - name: Capture immutable deployment evidence
        run: |
          npx wrangler deployments status --json > "$RUNNER_TEMP/reach-deployment.json"
          npx wrangler versions list --json > "$RUNNER_TEMP/reach-versions.json"
          node -e '
            const fs = require("fs");
            if (!JSON.parse(fs.readFileSync(process.argv[1], "utf8"))) process.exit(1);
            if (!JSON.parse(fs.readFileSync(process.argv[2], "utf8")).length) process.exit(1);
            console.log("Reach deployment evidence captured.");
          ' "$RUNNER_TEMP/reach-deployment.json" "$RUNNER_TEMP/reach-versions.json"
